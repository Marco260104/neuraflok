      <div class="notice" id="keychainNotice" role="status" hidden>
        <i class="ico ph ph-lock-key" aria-hidden="true"></i>
        <span>macOS asks for your password once after each update, so this version can open its saved keys. Enter your Mac login password and choose “Always Allow”. Chats and the browser connection continue as soon as you answer.</span>
      </div>
      <div class="notice" id="updateNotice" hidden>
        <i class="ico ph ph-lightning" aria-hidden="true"></i>
        <span id="updateText"></span>
        <button class="btn btn-quiet" id="updateGet" type="button" hidden>Get it</button>
        <button class="btn btn-quiet" id="updateInstall" type="button" hidden>Install now</button>
        <button class="btn btn-quiet" id="updateExtension" type="button" hidden>Update extension</button>
      </div>
