name: Publish release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag such as v0.1.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Confirm the tag is unpublished
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/check-release-absent.mjs
      - name: Verify release metadata agrees
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${TAG#v}"
          if [ "$VERSION" != "$TAG_VERSION" ]; then
            echo "package.json version $VERSION does not match tag $TAG"
            exit 1
          fi
          SOURCE_VERSION="$(node -e "const m = require('fs').readFileSync('backend/infrastructure/settings/version.ts','utf8').match(/APP_VERSION = '([^']+)'/); if (!m) process.exit(1); process.stdout.write(m[1])")"
          MANIFEST_VERSION="$(node -p "require('./browser-extension/manifest.json').version")"
          CHANGELOG_VERSION="$(node -e "const m = require('fs').readFileSync('CHANGELOG.md','utf8').match(/^## \\[(\\d+\\.\\d+\\.\\d+)\\]/m); if (!m) process.exit(1); process.stdout.write(m[1])")"
          NOTES="docs/release-notes/v${VERSION}.md"
          if [ "$SOURCE_VERSION" != "$VERSION" ] || [ "$MANIFEST_VERSION" != "$VERSION" ] || [ "$CHANGELOG_VERSION" != "$VERSION" ]; then
            echo "Version metadata does not agree: package=$VERSION source=$SOURCE_VERSION extension=$MANIFEST_VERSION changelog=$CHANGELOG_VERSION"
            exit 1
          fi
          if [ ! -f "$NOTES" ]; then
            echo "$NOTES is missing"
            exit 1
          fi
          if ! grep -qE '^## .+$' "$NOTES"; then
            echo "$NOTES has no release title"
            exit 1
          fi

  candidate:
    needs: preflight
    uses: ./.github/workflows/release.yml
    with:
      ref: ${{ inputs.tag || github.ref }}

  publish:
    name: Publish
    needs: candidate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          name: neuraflok-candidate-${{ github.run_id }}
          path: release
      - name: Confirm the tag is still unpublished
        run: node scripts/check-release-absent.mjs
      - name: Publish the release
        run: |
          set -euo pipefail
          cd release
          gh release create "$TAG" \
            --title "NEURAFLOK ${TAG#v}" \
            --notes-file "../docs/release-notes/${TAG}.md" \
            --verify-tag \
            NEURAFLOK-Setup-x64.exe \
            NEURAFLOK-Setup-arm64.exe \
            NEURAFLOK-macOS-x64.dmg \
            NEURAFLOK-macOS-x64.zip \
            NEURAFLOK-macOS-arm64.dmg \
            NEURAFLOK-macOS-arm64.zip \
            NEURAFLOK-Linux-x64.AppImage \
            NEURAFLOK-Linux-x64.deb \
            NEURAFLOK-Linux-arm64.AppImage \
            NEURAFLOK-Linux-arm64.deb \
            NEURAFLOK-Provider-Extension.zip \
            NEURAFLOK-Native-Sources.tar.gz \
            SHA256SUMS.txt
