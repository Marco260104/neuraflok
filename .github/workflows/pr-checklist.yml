name: PR checklist

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  checklist:
    name: PR checklist
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: node scripts/pr-check.mjs

  fail-first-platform:
    name: Fail-first platform
    runs-on: ubuntu-24.04
    outputs:
      runner: ${{ steps.plan.outputs.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - id: plan
        run: node scripts/pr-fail-first.mjs --runner >> "$GITHUB_OUTPUT"

  fail-first:
    name: Fail-first test
    needs: fail-first-platform
    runs-on: ${{ needs.fail-first-platform.outputs.runner == 'windows-2025' && 'windows-2025' || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: node scripts/pr-fail-first.mjs
