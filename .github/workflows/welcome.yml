name: Welcome

on:
  issues:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  welcome:
    name: Welcome
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/first-interaction@1c4688942c71f71d4f5502a26ea67c331730fa4d
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue_message: |
            Thanks for opening this issue. Please include the app version, operating system, and a minimal reproduction. Remove account details, personal paths, conversation text, and credentials before posting.
          pr_message: |
            Thanks for your first pull request, and welcome! Please read CONTRIBUTING.md, fill in Why / What changed / Test, and keep Allow edits by maintainers on.
