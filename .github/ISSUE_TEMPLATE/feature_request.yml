name: Feature request
description: Propose a focused change to NEURAFLOK
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user need is missing today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The smallest change that would solve it.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other approaches you considered.
    validations:
      required: false
